# Name of the workflow (appears in GitHub Actions tab)
name: CI Tests

# When this workflow should run
on:
  pull_request:
    branches: [develop]      # Only run on PRs targeting develop branch
  # push:
    # branches: [develop]      # Also run on direct pushes to develop

# Define the jobs to run
jobs:
  test:
    # The display name for this job
    name: Test on Node ${{ matrix.node-version }}
    
    # Virtual machine to run on
    runs-on: ubuntu-latest
    
    # Strategy matrix to test multiple Node versions
    strategy:
      matrix:
        node-version: [16, 18, 20, 22]  # Test on multiple Node versions
        # You can also specify specific versions like:
        # node-version: ['16.20.0', '18.17.0', '20.5.0', 'latest']
    
    # Steps to execute in this job
    steps:
      # Step 1: Download the repository code
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # Step 2: Set up Node.js environment
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'              # Cache npm dependencies for faster builds
          cache-dependency-path: package-lock.json  # Path to lockfile
      
      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          npm ci                    # Clean install (faster than npm install)
      
      # # Step 4: Run linting (optional)
      # - name: Run ESLint
      #   run: npm run lint
      #   continue-on-error: false    # Fail the build if linting fails
      
      # Step 4: Run tests
      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test            # Set environment variable for tests
      
      # # Step 5: Upload test coverage (optional)
      # - name: Upload coverage reports
      #   if: matrix.node-version == 20  # Only upload once (from Node 20)
      #   uses: codecov/codecov-action@v3
      #   with:
      #     file: ./coverage/lcov.info

  # Additional job to ensure all tests pass (creates single status check)
  test-results:
    name: Test Results
    runs-on: ubuntu-latest
    needs: test                     # Wait for test job to complete
    if: always()                    # Run even if tests fail
    
    steps:
      - name: Check test results
        run: |
          if [[ "${{ needs.test.result }}" == "success" ]]; then
            echo "✅ All tests passed!"
            exit 0
          else
            echo "❌ Tests failed!"
            exit 1
          fi
